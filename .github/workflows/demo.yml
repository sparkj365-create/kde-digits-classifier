name: Run demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py --bandwidths 10
      - uses: actions/upload-artifact@v4
        with:
          name: kde-outputs
          path: outputs/
